services:
  web:
    build: .
    command: ["uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./generated:/app/generated
      - ./var:/app/var
  scheduler:
    build: .
    command: ["/usr/local/bin/supercronic", "/app/supercronic.cron"]
    volumes:
      - ./data:/app/data
      - ./generated:/app/generated
      - ./var:/app/var
